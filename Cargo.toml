[package]
name = "lima-devshell"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lima-devshell"
path = "src/main.rs"

[features]
# Feature to indicate that lima-devshell-config.json exists and should be embedded
# This is enabled during Nix builds when the config file is generated
has-config = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
git2 = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full", "process"] }
