# Lima instance for lima-devshell development
vmType: "vz"
arch: "aarch64"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

mounts:
  # Mount this specific worktree
  - location: "/Users/bobby/.local/state/git/worktrees/io.github/bdelanghe/lima-devshell/main"
    mountPoint: "/worktrees/io.github/bdelanghe/lima-devshell/main"
    writable: true
  # Mount the bare repo
  - location: "/Users/bobby/.local/share/git/bare/io.github/bdelanghe/lima-devshell.git/worktrees"
    mountPoint: "/git/bare/worktrees"
    writable: true

memory: "6GiB"
cpus: 4
disk: "80GiB"

ssh:
  localPort: 60720
  loadDotSSHPubKeys: true

env:
  LIMA_WORKDIR_DISABLED: "1"

# Provisioning step to create the dev user
provision:
  - mode: system
    script: |
      #!/bin/sh
      # Create user if not present
      if ! id dev >/dev/null 2>&1; then
        useradd -m -s /bin/bash dev
        passwd -d dev
        usermod -aG sudo dev
      fi
